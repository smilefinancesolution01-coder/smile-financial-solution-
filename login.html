<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Smile Financial Solution</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f8ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:100%;
max-width:400px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
color:#0d6efd;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

#message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.register-link{
text-align:center;
margin-top:15px;
}
</style>

</head>
<body>

<div class="container">

<h2>Agent Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<button type="submit">
Login
</button>

</form>

<p id="message"></p>

<div class="register-link">
<a href="register.html">
New User? Register Here
</a>
</div>

</div>

<script type="module">

import { auth } from "./firebase/config.js";

import {
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const loginForm =
document.getElementById("loginForm");

loginForm.addEventListener("submit", async (e)=>{

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

message.innerHTML =
"Login Successful ✅";

setTimeout(()=>{
window.location.href="dashboard.html";
},1000);

}
catch(error){

message.innerHTML =
error.code + " : " + error.message;

console.log(error);

}

});

</script>

</body>
</html>
