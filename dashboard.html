<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Smile Financial Solution</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f8ff;
}

header{
background:#0d6efd;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.btn{
display:inline-block;
background:#0d6efd;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:5px;
margin-top:10px;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;
}

.service-card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

button{
background:red;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
}
</style>

</head>
<body>

<header>
<h2>Smile Financial Solution</h2>
<button id="logoutBtn">Logout</button>
</header>

<div class="container">

<div class="card">
<h3>Welcome Agent</h3>
<p id="userEmail">Loading...</p>
</div>

<div class="services">

<div class="service-card">
🏦 Business Loan
</div>

<div class="service-card">
👤 Personal Loan
</div>

<div class="service-card">
🏠 Home Loan
</div>

<div class="service-card">
💳 Credit Card
</div>

<div class="service-card">
🚗 Motor Insurance
</div>

<div class="service-card">
❤️ Health Insurance
</div>

<div class="service-card">
🛡️ Life Insurance
</div>

<div class="service-card">
📄 GST Registration
</div>

<div class="service-card">
🏢 MSME Registration
</div>

</div>

</div>

<script type="module">

import { auth } from "./firebase/config.js";

import {
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("userEmail").innerHTML =
user.email;

}else{

window.location.href="login.html";

}

});

document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

await signOut(auth);

window.location.href="login.html";

});

</script>

</body>
</html>
