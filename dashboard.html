<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body{margin:0;font-family:Arial;background:#f4f8ff}
header{background:#0d6efd;color:#fff;padding:15px;display:flex;justify-content:space-between}
.container{padding:20px}
.card{background:#fff;padding:15px;margin-bottom:15px;border-radius:10px;box-shadow:0 0 8px rgba(0,0,0,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.service{background:#e9f2ff;padding:15px;border-radius:10px;text-align:center;cursor:pointer}
.btn{background:#0d6efd;color:#fff;padding:8px 12px;border:none;border-radius:5px;cursor:pointer}
</style>
</head>

<body>

<header>
<h3>Smile Financial Solution</h3>
<button class="btn" id="logoutBtn">Logout</button>
</header>

<div class="container">

<div class="card">
<h3>Agent Profile</h3>
<p id="name">Loading...</p>
<p id="agentId"></p>
<p id="membership"></p>
<p id="status"></p>
</div>

<div class="card">
<h3>Why Join Us</h3>
<ul>
<li>Unlimited Earning</li>
<li>No Target</li>
<li>Work From Home</li>
<li>Training + Certificate</li>
<li>CRM Access</li>
</ul>
</div>

<div class="card">
<h3>Wallet</h3>
<p>Balance: ₹0</p>
</div>

<div class="card">
<h3>Services</h3>

<div class="grid">

<div class="service">Business Loan</div>
<div class="service">Personal Loan</div>
<div class="service">Home Loan</div>
<div class="service">Credit Card</div>
<div class="service">Insurance</div>
<div class="service">GST/MSME</div>

</div>

</div>

</div>

<script type="module">

import { auth, db } from "./firebase/config.js";
import { onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import { doc, getDoc } 
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

onAuthStateChanged(auth, async(user)=>{

if(!user){
window.location.href="login.html";
}

const snap = await getDoc(doc(db,"users",user.uid));

if(snap.exists()){
const data = snap.data();

document.getElementById("name").innerText = "Name: " + data.name;
document.getElementById("agentId").innerText = "ID: " + data.agentId;
document.getElementById("membership").innerText = "Plan: " + data.membership;
document.getElementById("status").innerText = "Status: " + data.status;
}

});

document.getElementById("logoutBtn").addEventListener("click",async()=>{
await signOut(auth);
window.location.href="login.html";
});

</script>

</body>
</html>
