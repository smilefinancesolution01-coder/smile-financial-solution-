<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f8ff;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.card h2{
color:#0d6efd;
font-size:32px;
margin-top:10px;
}
</style>

</head>
<body>

<h1>Smile Financial Solution Admin Panel</h1>

<div class="cards">

<div class="card">
<h3>Total Agents</h3>
<h2 id="totalUsers">0</h2>
</div>

<div class="card">
<h3>Total Leads</h3>
<h2 id="totalLeads">0</h2>
</div>

</div>

<script type="module">

import { db } from "../firebase/config.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

async function loadData(){

const usersSnapshot =
await getDocs(collection(db,"users"));

document.getElementById("totalUsers").innerHTML =
usersSnapshot.size;

const leadsSnapshot =
await getDocs(collection(db,"leads"));

document.getElementById("totalLeads").innerHTML =
leadsSnapshot.size;

}

loadData();

</script>

</body>
</html>
