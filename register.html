<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Registration</title>

<style>
body{
font-family:Arial,sans-serif;
padding:20px;
max-width:500px;
margin:auto;
}

input{
width:100%;
padding:12px;
margin:10px 0;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px;
width:100%;
cursor:pointer;
}

#message{
margin-top:15px;
font-weight:bold;
}
</style>

</head>
<body>

<h1>Agent Registration</h1>

<form id="registerForm">

<input type="text"
id="name"
placeholder="Full Name"
required>

<input type="email"
id="email"
placeholder="Email"
required>

<input type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Register
</button>

</form>

<p id="message"></p>

<script type="module">

import { auth } from "./firebase/config.js";

import {
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const form =
document.getElementById("registerForm");

form.addEventListener("submit", async (e)=>{

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

try{

await createUserWithEmailAndPassword(
auth,
email,
password
);

message.innerHTML =
"Registration Successful ✅";

}
catch(error){

message.innerHTML =
error.code + " : " + error.message;

console.log(error);

}

});

</script>

</body>
</html>
