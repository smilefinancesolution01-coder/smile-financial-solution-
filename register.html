<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Registration</title>

<style>
body{
font-family:Arial;
background:#f4f8ff;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
background:#fff;
padding:25px;
border-radius:10px;
width:100%;
max-width:500px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
color:#0d6efd;
margin-bottom:15px;
}

input,select{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

#message{
text-align:center;
margin-top:10px;
font-weight:bold;
color:green;
}
</style>
</head>

<body>

<div class="container">

<h2>Agent Registration</h2>

<form id="registerForm">

<input type="text" id="name" placeholder="Full Name" required>
<input type="tel" id="mobile" placeholder="Mobile Number" required>
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>

<input type="date" id="dob" required>
<input type="text" id="city" placeholder="City" required>
<input type="text" id="state" placeholder="State" required>

<input type="text" id="pan" placeholder="PAN Number" required>
<input type="text" id="aadhaar" placeholder="Aadhaar Number" required>

<select id="experience">
<option value="Fresher">Fresher</option>
<option value="0-1 Year">0-1 Year</option>
<option value="1-3 Years">1-3 Years</option>
<option value="3+ Years">3+ Years</option>
</select>

<input type="text" id="occupation" placeholder="Current Occupation">

<select id="membership">
<option value="Free">Free</option>
<option value="Silver">Silver ₹299</option>
<option value="Gold">Gold ₹499</option>
</select>

<input type="text" id="upi" placeholder="UPI ID">

<button type="submit">Register</button>

</form>

<p id="message"></p>

</div>

<script type="module">

import { auth, db } from "./firebase/config.js";

import {
createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", async(e)=>{
e.preventDefault();

try{

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const name = document.getElementById("name").value;
const mobile = document.getElementById("mobile").value;
const dob = document.getElementById("dob").value;
const city = document.getElementById("city").value;
const state = document.getElementById("state").value;
const pan = document.getElementById("pan").value;
const aadhaar = document.getElementById("aadhaar").value;
const experience = document.getElementById("experience").value;
const occupation = document.getElementById("occupation").value;
const membership = document.getElementById("membership").value;
const upi = document.getElementById("upi").value;

const userCredential = await createUserWithEmailAndPassword(
auth,
email,
password
);

const user = userCredential.user;

await setDoc(doc(db,"users",user.uid),{

agentId:"SFS"+Math.floor(Math.random()*100000),

name,
mobile,
email,
dob,
city,
state,
pan,
aadhaar,
experience,
occupation,
membership,
upi,

walletBalance:0,
status:"Pending Verification",
role:"agent",
createdAt:new Date()

});

// SUCCESS MESSAGE
message.style.color = "green";
message.innerText = "Registration Successful ✔ Redirecting...";

setTimeout(()=>{
window.location.href = "dashboard.html";
},2000);

}
catch(error){

message.style.color = "red";
message.innerText = error.message;

}

});

</script>

</body>
</html>
